name: Purple-Team Gym CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest tests.test_gym -v 2>&1
      - name: Build dashboard
        run: python build_dashboard.py
      - name: Generate posture report
        run: python ciso_report.py
      - name: Verify artifacts exist
        run: |
          test -f dashboard.html && echo "dashboard.html OK"
          test -f posture_report.html && echo "posture_report.html OK"
